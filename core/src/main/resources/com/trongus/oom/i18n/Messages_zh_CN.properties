# ── AlertFormatter section headings ──────────────────────────────────────────
section.banner=\=== JVM OOM 警报 ===
section.heap=-- 堆 --
section.nonheap=-- 非堆（Metaspace / 代码缓存）--
section.pools=-- 内存池 --
section.gc=-- 垃圾回收 --
section.leak=-- 泄漏趋势 --
section.diagnosis=-- 诊断 --
section.dump=-- 堆转储 --
section.footer=\======================

# ── AlertFormatter labels ────────────────────────────────────────────────────
label.severity=严重性
label.process=进程
label.timestamp=时间戳
label.used=已使用
label.committed=已提交
label.max=最大值 (-Xmx)
label.usage=使用率
label.max.plain=最大值
label.nonheap.unlimited=无限制
label.gc.none=没有可用的 GC Bean。
label.gc.total=GC 总时间
label.gc.uptime=JVM 运行时间
label.gc.overhead=GC 开销
label.leak.postgc=GC 后堆
label.leak.growth=增长率
label.leak.insufficient=数据不足
label.leak.mphour=MB/小时
label.dump.path=路径
label.unit.mb=MB
label.unit.ms=ms
label.unit.pct=%

# ── ThresholdRiskAssessor ────────────────────────────────────────────────────
assess.critical=严重 – OOM 即将发生。
assess.critical.heap=堆使用率 {0,number,0.0}%（阈值 {1,number,0.0}%）。
assess.critical.gc=GC 开销 {0,number,0.0}%（阈值 {1,number,0.0}%）。
assess.warning=警告 – OOM 风险升高。
assess.warning.heap=堆使用率 {0,number,0.0}%（阈值 {1,number,0.0}%）。
assess.warning.gc=GC 开销 {0,number,0.0}%（阈值 {1,number,0.0}%）。
assess.warning.leak=GC 后堆以 {0,number,0.00} MB/小时 的速率增长。
assess.ok=正常 – 所有指标均在正常范围内。

# ── MxBeanDiagnosticsCollector ───────────────────────────────────────────────
diag.gc.none=未记录 GC 活动 – GC 可能已禁用或尚未触发。
diag.gc.summary=GC 总时间：{0} ms | 开销：{1,number,0.0}%。
diag.gc.warning=警告：GC 开销 {0,number,0.0}% 超过阈值 {1,number,0.0}%。
diag.heap=堆已使用最大值的 {0,number,0.0}%。
diag.leak.growing=GC 后堆以 {0,number,0.00} MB/小时 的速率增长 – 可能存在内存泄漏。
diag.leak.stable=GC 后堆稳定 – 未检测到泄漏趋势。
diag.leak.insufficient=用于趋势分析的 GC 后样本不足。

# ── OomCauseAnalyser ─────────────────────────────────────────────────────────
cause.runaway_gc=堆使用率 {0,number,0.0}%（严重阈值 {1,number,0.0}%），GC 开销 {2,number,0.0}%（阈值 {3,number,0.0}%）。JVM 将大部分时间花费在垃圾回收上，无法回收足够的内存。OutOfMemoryError 即将发生。
cause.heap_exhaustion=堆已使用最大容量的 {0,number,0.0}%（严重阈值 {1,number,0.0}%）。可用空闲堆太小，无法满足典型的分配请求。下次大型分配时可能会抛出 OutOfMemoryError。
cause.gc_overhead=GC 开销占 JVM 运行时间的 {0,number,0.0}%（阈值 {1,number,0.0}%）。JVM 花费在垃圾回收上的时间过多，与有用工作相比不成比例。除非分配速率降低，否则堆很快就会填满。
cause.memory_leak=GC 后堆在多个 GC 周期内以 {0,number,0.00} MB/小时 的速率持续增长。活动对象保留量稳步增加，这是内存泄漏的强烈信号。
cause.none=所有受监控的 JVM 指标均在正常范围内。当前未检测到 OOM 风险。
