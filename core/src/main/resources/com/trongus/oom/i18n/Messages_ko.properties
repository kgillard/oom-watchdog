# ── ThresholdRiskAssessor ────────────────────────────────────────────────────
assess.critical=심각 – OOM이 임박했습니다.
assess.critical.heap=힙 사용률 {0,number,0.0}% (임계값 {1,number,0.0}%).
assess.critical.gc=GC 오버헤드 {0,number,0.0}% (임계값 {1,number,0.0}%).
assess.warning=경고 – OOM 위험이 높아졌습니다.
assess.warning.heap=힙 사용률 {0,number,0.0}% (임계값 {1,number,0.0}%).
assess.warning.gc=GC 오버헤드 {0,number,0.0}% (임계값 {1,number,0.0}%).
assess.warning.leak=GC 후 힙이 {0,number,0.00} MB/시간 증가 중.
assess.ok=정상 – 모든 메트릭이 정상 범위 내에 있습니다.

# ── MxBeanDiagnosticsCollector ───────────────────────────────────────────────
diag.gc.none=GC 활동이 기록되지 않았습니다 – GC가 비활성화되었거나 아직 트리거되지 않았을 수 있습니다.
diag.gc.summary=GC 총 시간: {0} ms | 오버헤드: {1,number,0.0}%.
diag.gc.warning=경고: GC 오버헤드 {0,number,0.0}%가 임계값 {1,number,0.0}%를 초과합니다.
diag.heap=힙이 최대값의 {0,number,0.0}%를 사용하고 있습니다.
diag.leak.growing=GC 후 힙이 {0,number,0.00} MB/시간 증가 중 – 메모리 누수 가능성이 있습니다.
diag.leak.stable=GC 후 힙이 안정적입니다 – 누수 추세가 감지되지 않았습니다.
diag.leak.insufficient=추세 분석을 위한 GC 후 샘플이 부족합니다.

# ── OomCauseAnalyser ─────────────────────────────────────────────────────────
cause.runaway_gc=힙 사용률 {0,number,0.0}% (심각 임계값 {1,number,0.0}%) 및 GC 오버헤드 {2,number,0.0}% (임계값 {3,number,0.0}%). JVM이 가비지 컬렉션에 대부분의 시간을 사용하고 있으며 충분한 메모리를 회수하지 못하고 있습니다. OutOfMemoryError가 임박했습니다.
cause.heap_exhaustion=힙이 최대 용량의 {0,number,0.0}%를 사용하고 있습니다 (심각 임계값 {1,number,0.0}%). 사용 가능한 여유 힙이 너무 작아 일반적인 할당 요청을 처리할 수 없습니다. 다음 대규모 할당 시 OutOfMemoryError가 발생할 수 있습니다.
cause.gc_overhead=GC 오버헤드가 JVM 가동 시간의 {0,number,0.0}% (임계값 {1,number,0.0}%)입니다. JVM이 유용한 작업보다 가비지 컬렉션에 너무 많은 시간을 소비하고 있습니다. 할당 속도가 줄어들지 않으면 힙이 곧 가득 찰 것입니다.
cause.memory_leak=GC 후 힙이 여러 GC 주기에 걸쳐 {0,number,0.00} MB/시간 증가하고 있습니다. 활성 객체 보존량이 꾸준히 증가하고 있으며, 이는 메모리 누수의 강력한 지표입니다.
cause.none=모니터링되는 모든 JVM 메트릭이 정상 범위 내에 있습니다. 현재 OOM 위험은 감지되지 않았습니다.
