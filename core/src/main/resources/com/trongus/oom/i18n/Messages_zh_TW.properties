# ── ThresholdRiskAssessor ────────────────────────────────────────────────────
assess.critical=嚴重 – OOM 即將發生。
assess.critical.heap=堆積使用率 {0,number,0.0}%（閾值 {1,number,0.0}%）。
assess.critical.gc=GC 負擔 {0,number,0.0}%（閾值 {1,number,0.0}%）。
assess.warning=警告 – OOM 風險升高。
assess.warning.heap=堆積使用率 {0,number,0.0}%（閾值 {1,number,0.0}%）。
assess.warning.gc=GC 負擔 {0,number,0.0}%（閾值 {1,number,0.0}%）。
assess.warning.leak=GC 後堆積以 {0,number,0.00} MB/小時 的速率增長。
assess.ok=正常 – 所有指標均在正常範圍內。

# ── MxBeanDiagnosticsCollector ───────────────────────────────────────────────
diag.gc.none=未記錄 GC 活動 – GC 可能已停用或尚未觸發。
diag.gc.summary=GC 總時間：{0} ms | 負擔：{1,number,0.0}%。
diag.gc.warning=警告：GC 負擔 {0,number,0.0}% 超過閾值 {1,number,0.0}%。
diag.heap=堆積已使用最大值的 {0,number,0.0}%。
diag.leak.growing=GC 後堆積以 {0,number,0.00} MB/小時 的速率增長 – 可能存在記憶體洩漏。
diag.leak.stable=GC 後堆積穩定 – 未偵測到洩漏趨勢。
diag.leak.insufficient=用於趨勢分析的 GC 後樣本不足。

# ── OomCauseAnalyser ─────────────────────────────────────────────────────────
cause.runaway_gc=堆積使用率 {0,number,0.0}%（嚴重閾值 {1,number,0.0}%），GC 負擔 {2,number,0.0}%（閾值 {3,number,0.0}%）。JVM 將大部分時間花費在垃圾回收上，無法回收足夠的記憶體。OutOfMemoryError 即將發生。
cause.heap_exhaustion=堆積已使用最大容量的 {0,number,0.0}%（嚴重閾值 {1,number,0.0}%）。可用的可用堆積太小，無法服務典型的配置要求。下次大型配置時可能會擲回 OutOfMemoryError。
cause.gc_overhead=GC 負擔佔 JVM 執行時間的 {0,number,0.0}%（閾值 {1,number,0.0}%）。JVM 在垃圾回收上花費的時間過多，與有用工作不成比例。除非配置率降低，否則堆積很快就會填滿。
cause.memory_leak=GC 後堆積在多個 GC 週期內以 {0,number,0.00} MB/小時 的速率持續增長。活動物件保留量穩步增加，這是記憶體洩漏的強烈訊號。
cause.none=所有受監控的 JVM 指標均在正常範圍內。目前未偵測到 OOM 風險。
