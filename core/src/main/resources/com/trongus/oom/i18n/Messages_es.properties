# ── OomCauseAnalyser ─────────────────────────────────────────────────────────
cause.runaway_gc=Heap al {0,number,0.0}\u00a0% (umbral cr\u00edtico {1,number,0.0}\u00a0%) y sobrecarga de GC al {2,number,0.0}\u00a0% (umbral {3,number,0.0}\u00a0%). La JVM pasa la mayor parte del tiempo en recolecci\u00f3n de basura y no puede recuperar suficiente memoria. Un OutOfMemoryError es inminente.
cause.heap_exhaustion=El heap usa el {0,number,0.0}\u00a0% de la capacidad m\u00e1xima (umbral cr\u00edtico {1,number,0.0}\u00a0%). La memoria libre disponible es demasiado peque\u00f1a para satisfacer solicitudes de asignaci\u00f3n t\u00edpicas. Puede producirse un OutOfMemoryError en la pr\u00f3xima asignaci\u00f3n grande.
cause.gc_overhead=La sobrecarga de GC es del {0,number,0.0}\u00a0% del tiempo de actividad de JVM (umbral {1,number,0.0}\u00a0%). La JVM dedica demasiado tiempo a la recolecci\u00f3n de basura en relaci\u00f3n con el trabajo \u00fatil. El heap probablemente se llenar\u00e1 pronto a menos que disminuya la tasa de asignaci\u00f3n.
cause.memory_leak=El heap post-GC crece a {0,number,0.00}\u00a0MB/hora en varios ciclos de GC. La retenci\u00f3n de objetos activos aumenta de forma sostenida, lo que indica una fuga de memoria.
cause.none=Todas las m\u00e9tricas de JVM supervisadas est\u00e1n dentro de los l\u00edmites normales. Actualmente no se detecta ning\u00fan riesgo de OOM.
