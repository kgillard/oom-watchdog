# ── OomCauseAnalyser ─────────────────────────────────────────────────────────
cause.runaway_gc=Heap bei {0,number,0.0}\u00a0% (kritischer Schwellenwert {1,number,0.0}\u00a0%) und GC-Overhead bei {2,number,0.0}\u00a0% (Schwellenwert {3,number,0.0}\u00a0%). Die JVM verbringt den Gro\u00dfteil ihrer Zeit mit Garbage Collection und kann nicht gen\u00fcgend Speicher freigeben. Ein OutOfMemoryError steht unmittelbar bevor.
cause.heap_exhaustion=Heap verwendet {0,number,0.0}\u00a0% der maximalen Kapazit\u00e4t (kritischer Schwellenwert {1,number,0.0}\u00a0%). Der verf\u00fcgbare freie Heap reicht nicht aus, um typische Speicheranforderungen zu erf\u00fcllen. Beim n\u00e4chsten gro\u00dfen Zuweisungsversuch kann ein OutOfMemoryError auftreten.
cause.gc_overhead=GC-Overhead betr\u00e4gt {0,number,0.0}\u00a0% der JVM-Betriebszeit (Schwellenwert {1,number,0.0}\u00a0%). Die JVM verbringt zu viel Zeit mit Garbage Collection. Der Heap wird sich wahrscheinlich bald f\u00fcllen, sofern die Allokationsrate nicht sinkt.
cause.memory_leak=Der Post-GC-Heap w\u00e4chst \u00fcber mehrere GC-Zyklen hinweg mit {0,number,0.00}\u00a0MB/Stunde. Die Retention lebender Objekte nimmt stetig zu \u2013 ein deutlicher Hinweis auf ein Speicherleck.
cause.none=Alle \u00fcberwachten JVM-Metriken liegen im Normalbereich. Derzeit wird kein OOM-Risiko erkannt.
