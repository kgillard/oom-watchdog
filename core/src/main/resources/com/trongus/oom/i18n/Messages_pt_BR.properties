# ── ThresholdRiskAssessor ────────────────────────────────────────────────────
assess.critical=CRÍTICO – OOM iminente.
assess.critical.heap=Heap em {0,number,0.0}% (limite {1,number,0.0}%).
assess.critical.gc=Sobrecarga de GC {0,number,0.0}% (limite {1,number,0.0}%).
