# ── MxBeanDiagnosticsCollector ───────────────────────────────────────────────
diag.gc.none=Nenhuma atividade de GC registrada – o GC pode estar desativado ou ainda não acionado.
diag.gc.summary=Tempo total de GC: {0} ms | Sobrecarga: {1,number,0.0}%.
diag.gc.warning=AVISO: Sobrecarga de GC {0,number,0.0}% excede o limite {1,number,0.0}%.
diag.heap=Heap utiliza {0,number,0.0}% do máximo.
diag.leak.growing=Heap pós-GC crescendo a {0,number,0.00} MB/hora – possível vazamento de memória.
diag.leak.stable=Heap pós-GC estável – nenhuma tendência de vazamento detectada.
diag.leak.insufficient=Amostras pós-GC insuficientes para análise de tendência.

# ── OomCauseAnalyser ─────────────────────────────────────────────────────────
cause.runaway_gc=Heap em {0,number,0.0}% (limite crítico {1,number,0.0}%) e sobrecarga de GC em {2,number,0.0}% (limite {3,number,0.0}%). A JVM está gastando a maior parte do tempo na coleta de lixo e não consegue recuperar memória suficiente. Um OutOfMemoryError é iminente.
cause.heap_exhaustion=O heap utiliza {0,number,0.0}% da capacidade máxima (limite crítico {1,number,0.0}%). A memória livre disponível é muito pequena para atender a solicitações de alocação típicas. Um OutOfMemoryError pode ser lançado na próxima alocação grande.
cause.gc_overhead=A sobrecarga de GC é {0,number,0.0}% do tempo de atividade da JVM (limite {1,number,0.0}%). A JVM está dedicando tempo demais à coleta de lixo em relação ao trabalho útil. O heap provavelmente será preenchido em breve, a menos que a taxa de alocação diminua.
cause.memory_leak=O heap pós-GC está crescendo a {0,number,0.00} MB/hora em vários ciclos de GC. A retenção de objetos ativos está aumentando constantemente, o que é um forte indicativo de vazamento de memória.
cause.none=Todas as métricas da JVM monitoradas estão dentro dos limites normais. Nenhum risco de OOM é detectado no momento.
