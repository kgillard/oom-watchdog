# ── ThresholdRiskAssessor ────────────────────────────────────────────────────
assess.critical=重大 – OOM が差し迫っています。
assess.critical.heap=ヒープ使用率 {0,number,0.0}%（しきい値 {1,number,0.0}%）。
assess.critical.gc=GC オーバーヘッド {0,number,0.0}%（しきい値 {1,number,0.0}%）。
assess.warning=警告 – OOM リスクが高まっています。
assess.warning.heap=ヒープ使用率 {0,number,0.0}%（しきい値 {1,number,0.0}%）。
assess.warning.gc=GC オーバーヘッド {0,number,0.0}%（しきい値 {1,number,0.0}%）。
assess.warning.leak=GC 後ヒープが {0,number,0.00} MB/時間 で増加中。
assess.ok=OK – すべてのメトリックが正常範囲内です。

# ── MxBeanDiagnosticsCollector ───────────────────────────────────────────────
diag.gc.none=GC アクティビティーが記録されていません – GC が無効化されているか、まだトリガーされていない可能性があります。
diag.gc.summary=GC 合計時間: {0} ms | オーバーヘッド: {1,number,0.0}%。
diag.gc.warning=警告: GC オーバーヘッド {0,number,0.0}% がしきい値 {1,number,0.0}% を超えています。
diag.heap=ヒープが最大値の {0,number,0.0}% を使用しています。
diag.leak.growing=GC 後ヒープが {0,number,0.00} MB/時間 で増加中 – メモリー・リークの可能性があります。
diag.leak.stable=GC 後ヒープは安定しています – リーク・トレンドは検出されていません。
diag.leak.insufficient=トレンド分析のための GC 後サンプルが不足しています。

# ── OomCauseAnalyser ─────────────────────────────────────────────────────────
cause.runaway_gc=ヒープ使用率 {0,number,0.0}%（重大しきい値 {1,number,0.0}%）および GC オーバーヘッド {2,number,0.0}%（しきい値 {3,number,0.0}%）。JVM は大部分の時間をガーベッジ・コレクションに費やしており、十分なメモリーを解放できていません。OutOfMemoryError が差し迫っています。
cause.heap_exhaustion=ヒープが最大容量の {0,number,0.0}% を使用しています（重大しきい値 {1,number,0.0}%）。利用可能な空きヒープが少なすぎて、通常の割り当て要求を処理できません。次の大きな割り当て時に OutOfMemoryError がスローされる可能性があります。
cause.gc_overhead=GC オーバーヘッドは JVM 稼働時間の {0,number,0.0}%（しきい値 {1,number,0.0}%）です。JVM は有用な作業に対してガーベッジ・コレクションに多くの時間を費やしています。割り当て速度が低下しない限り、ヒープはすぐにいっぱいになります。
cause.memory_leak=GC 後ヒープが複数の GC サイクルにわたって {0,number,0.00} MB/時間 で増加しています。生存オブジェクトの保持量が着実に増加しており、メモリー・リークの強い指標です。
cause.none=監視されているすべての JVM メトリックが正常範囲内にあります。現在 OOM リスクは検出されていません。
