# ── OomCauseAnalyser ─────────────────────────────────────────────────────────
cause.runaway_gc=Tas \u00e0 {0,number,0.0}\u00a0% (seuil critique {1,number,0.0}\u00a0%) et surcharge GC \u00e0 {2,number,0.0}\u00a0% (seuil {3,number,0.0}\u00a0%). La JVM passe la majeure partie de son temps en collecte de garbage et ne parvient pas \u00e0 lib\u00e9rer suffisamment de m\u00e9moire. Un OutOfMemoryError est imminent.
cause.heap_exhaustion=Le tas utilise {0,number,0.0}\u00a0% de la capacit\u00e9 maximale (seuil critique {1,number,0.0}\u00a0%). La m\u00e9moire libre disponible est trop faible pour r\u00e9pondre aux demandes d\u2019allocation habituelles. Un OutOfMemoryError peut \u00eatre lev\u00e9 lors de la prochaine allocation importante.
cause.gc_overhead=La surcharge GC repr\u00e9sente {0,number,0.0}\u00a0% du temps de fonctionnement JVM (seuil {1,number,0.0}\u00a0%). La JVM consacre trop de temps \u00e0 la collecte de garbage par rapport au travail utile. Le tas va probablement se remplir prochainement si le taux d\u2019allocation ne diminue pas.
cause.memory_leak=Le tas post-GC cro\u00eet de {0,number,0.00}\u00a0Mo/heure sur plusieurs cycles GC. La r\u00e9tention d\u2019objets vivants augmente r\u00e9guli\u00e8rement, ce qui indique fortement une fuite m\u00e9moire.
cause.none=Toutes les m\u00e9triques JVM surveill\u00e9es sont dans les limites normales. Aucun risque OOM n\u2019est actuellement d\u00e9tect\u00e9.
