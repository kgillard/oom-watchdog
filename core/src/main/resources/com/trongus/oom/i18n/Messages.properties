# ── ThresholdRiskAssessor assessment summaries ────────────────────────────────
# {0}=heap%, {1}=threshold%, {2}=gc%, {3}=gc-threshold%
assess.critical=CRITICAL \u2013 OOM imminent.
assess.critical.heap=Heap at {0,number,0.0}% (threshold {1,number,0.0}%).
assess.critical.gc=GC overhead {0,number,0.0}% (threshold {1,number,0.0}%).
assess.warning=WARNING \u2013 OOM risk elevated.
assess.warning.heap=Heap at {0,number,0.0}% (threshold {1,number,0.0}%).
assess.warning.gc=GC overhead {0,number,0.0}% (threshold {1,number,0.0}%).
# {0}=MB/hour
assess.warning.leak=Post-GC heap growing at {0,number,0.00} MB/hour.
assess.ok=OK \u2013 all metrics within normal bounds.

# ── MxBeanDiagnosticsCollector diagnosis notes ────────────────────────────────
# {0}=total GC ms, {1}=overhead %
diag.gc.none=No GC activity recorded \u2013 GC may be disabled or not yet triggered.
diag.gc.summary=Total GC time: {0} ms | Overhead: {1,number,0.0}%.
# {0}=overhead%, {1}=threshold%
diag.gc.warning=WARNING: GC overhead {0,number,0.0}% exceeds threshold {1,number,0.0}%.
# {0}=heap%
diag.heap=Heap used {0,number,0.0}% of max.
# {0}=MB/hour
diag.leak.growing=Post-GC heap growing at {0,number,0.00} MB/hour \u2013 possible memory leak.
diag.leak.stable=Post-GC heap stable \u2013 no leak trend detected.
diag.leak.insufficient=Insufficient post-GC samples for trend analysis.

# ── OomCauseAnalyser explanations ────────────────────────────────────────────
# {0}=heap%, {1}=heap-threshold%, {2}=gc%, {3}=gc-threshold%
cause.runaway_gc=Heap at {0,number,0.0}% (critical threshold {1,number,0.0}%) and GC overhead at {2,number,0.0}% (threshold {3,number,0.0}%). The JVM is spending most of its time in garbage collection and cannot reclaim enough memory. An OutOfMemoryError is imminent.
# {0}=heap%, {1}=heap-threshold%
cause.heap_exhaustion=Heap used {0,number,0.0}% of maximum capacity (critical threshold {1,number,0.0}%). Available free heap is too small to service typical allocation requests. An OutOfMemoryError may be thrown on the next large allocation.
# {0}=gc%, {1}=gc-threshold%
cause.gc_overhead=GC overhead is {0,number,0.0}% of JVM uptime (threshold {1,number,0.0}%). The JVM is spending too much time collecting garbage relative to useful work. Heap will likely fill up soon unless allocation rate decreases.
# {0}=MB/hour
cause.memory_leak=Post-GC heap is growing at {0,number,0.00} MB/hour across multiple GC cycles. Live object retention is increasing steadily, which is a strong indicator of a memory leak.
cause.none=All monitored JVM metrics are within normal bounds. No OOM risk is currently detected.
